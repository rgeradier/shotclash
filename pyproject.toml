[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rgeradier-shotclash"
version = "0.1.0"
description = "按结构键把条目聚类，标出指令与示例的冲突上的同组项与各组的代表样本"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "rgeradier" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://rgeradier.github.io"
Repository = "https://github.com/rgeradier/shotclash"
Issues = "https://github.com/rgeradier/shotclash/issues"

[project.scripts]
shotclash = "shotclash:main"

[tool.setuptools]
py-modules = ["shotclash"]
